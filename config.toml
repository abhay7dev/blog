baseURL = "https://abhay7.dev/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Abhay's Blog"
theme = "hugo-narrow"
mainSections = ["posts"]

[pagination]
  pagerSize = 6
  path = "page"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Abhay's blog"
  defaultAuthor = "Abhay"
  language = "en"
  shortName = "Abhay's Blog"
  contentWidth = "90rem"
  colorScheme = "twitter"

[params.favicon]
  svg = "/favicon.svg"

[params.header]
  sticky = true
  showThemeSwitch = false
  showDarkModeSwitch = true
  showContentWidthSwitch = false
  showLanguageSwitch = false

[params.header.logo]
  image = ""
  link = "/"

[params.home]
  recentPostsCount = 8
  contentOrder = ["recent-posts"]

[params.post]
  showRelated = true

[params.post.license]
  show = false

[params.toc]
  enabled = true
  position = "side"

[params.comments]
  enabled = true
  system = "giscus"

[params.comments.giscus]
  repo = "abhay7dev/blog"
  repoId = "R_kgDOJUap1Q"
  category = "Blog Posts"
  categoryId = "DIC_kwDOJUap1c4CVpBJ"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "transparent_dark"
  lang = "en"
